[project]
name = "change-creation"
version = "0.1.0"
description = "LangGraph copilot that co-writes ServiceNow change requests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2,<2",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/change_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
